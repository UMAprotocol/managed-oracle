name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.3.6

      - name: Show Forge version
        run: |
          forge --version

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install upgrade validation dependencies
        run: |
          yarn install --frozen-lockfile

      - name: Verify production reference build
        run: |
          printf '%s  %s\n' '91a49705c7f94b5fdd849aacd07e3efc0a77b8d7cdb7f94db9face918ad8529d' 'old-builds/build-info-prod-current/df0e71094fbc248e.json' | sha256sum --check

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Validate production storage layout upgrade
        run: |
          forge clean
          forge test --match-contract ManagedOptimisticOracleV2UpgradeValidationTest -vvv

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv --no-match-contract ".*Fork.*|ManagedOptimisticOracleV2UpgradeValidationTest"
        id: test

  reporters:
    name: Reporters package
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: default
    defaults:
      run:
        working-directory: reporters
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check

      - name: Run Forge build
        run: |
          forge build

      - name: Run Forge tests
        run: |
          forge test

  fork-tests:
    name: Fork Tests (Polygon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.3.6

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge build
        run: |
          forge build --sizes

      - name: Run fork tests
        run: |
          forge test --match-contract ".*Fork.*" --no-match-contract "ManagedOptimisticOracleV2ProductionUpgradeForkTest" --fork-url polygon -vvv
        env:
          NODE_URL_137: ${{ secrets.NODE_URL_137 }}

  production-upgrade-fork-tests:
    name: Production Upgrade Fork Tests (Polygon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge build
        run: |
          forge build --sizes

      - name: Run production upgrade fork tests
        run: |
          forge test --match-contract "ManagedOptimisticOracleV2ProductionUpgradeForkTest" --fork-url polygon -vvv
        env:
          NODE_URL_137: ${{ secrets.NODE_URL_137 }}
