name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.3.6

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv --no-match-contract ".*Fork.*"
        id: test

  pm-v2-oo-reporter:
    name: PM v2 OOReporter package
    runs-on: ubuntu-latest
    env:
      FOUNDRY_PROFILE: default
    defaults:
      run:
        working-directory: pm-v2-oo-reporter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check

      - name: Run Forge build
        run: |
          forge build

      - name: Run Forge tests
        run: |
          forge test

  fork-tests:
    name: Fork Tests (Polygon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.3.6

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge build
        run: |
          forge build --sizes

      - name: Run fork tests
        run: |
          forge test --match-contract ".*Fork.*" --no-match-contract "ManagedOptimisticOracleV2ProductionUpgradeForkTest" --fork-url polygon -vvv
        env:
          NODE_URL_137: ${{ secrets.NODE_URL_137 }}

  production-upgrade-fork-tests:
    name: Production Upgrade Fork Tests (Polygon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge build
        run: |
          forge build --sizes

      - name: Run production upgrade fork tests
        run: |
          forge test --match-contract "ManagedOptimisticOracleV2ProductionUpgradeForkTest" --fork-url polygon -vvv
        env:
          NODE_URL_137: ${{ secrets.NODE_URL_137 }}
